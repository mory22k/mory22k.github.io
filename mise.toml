[tools]
node = "22"
pnpm = "11.22.0"
rust = "latest"

[tasks.setup]
description = "開発用パッケージをインストールする"
run = "pnpm install"

[tasks.build]
description = "公開用サイトを_siteディレクトリへ生成する"
run = "pnpm run build"

[tasks.watch]
description = "サイトとSCSSの変更を監視する"
run = "pnpm run dev"

[tasks.serve]
description = "ローカル確認用サーバーを起動して変更を監視する"
run = "pnpm run dev"
